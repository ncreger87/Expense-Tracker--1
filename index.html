<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Business Ledger</title>
<style>
  :root {
    --ink: #20261F;
    --bg: #EFF1EE;
    --header: #1E3A2B;
    --headertext: #F2F5EF;
    --muted: #5A6B58;
    --line: #D8DED6;
    --card: #FFFFFF;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  .app { max-width: 480px; margin: 0 auto; min-height: 100vh; padding-bottom: 92px; position: relative; }
  .mono { font-variant-numeric: tabular-nums; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  .header { padding: 20px 18px 14px; background: var(--header); color: var(--headertext); }
  .eyebrow { font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.75; }
  .header-row { display: flex; align-items: baseline; justify-content: space-between; margin-top: 6px; }
  .header-sub { font-size: 12px; opacity: 0.7; }
  .header-big { font-size: 30px; font-weight: 700; }
  .header-small { font-size: 18px; font-weight: 600; text-align: right; }
  .card { background: var(--card); border-radius: 10px; box-shadow: 0 1px 3px rgba(30,58,43,0.10); margin: 10px 12px; overflow: hidden; padding: 14px; }
  .row { display: flex; gap: 8px; }
  input, select {
    width: 100%; box-sizing: border-box; padding: 11px 12px; border-radius: 8px;
    border: 1px solid #C9D1C6; font-size: 16px; background: #FBFCFA; color: var(--ink); margin-bottom: 10px;
  }
  label.field-label { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 5px; }
  .btn-primary { background: var(--header); color: var(--headertext); border: none; border-radius: 8px; padding: 13px 18px; font-size: 16px; font-weight: 600; width: 100%; cursor: pointer; }
  .btn-ghost { background: transparent; color: var(--header); border: 1px solid var(--header); border-radius: 8px; padding: 12px 18px; font-size: 15px; font-weight: 600; width: 100%; cursor: pointer; }
  .btn-danger { border-color: #B04A5A; color: #B04A5A; }
  .chip-row { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 10px; }
  .chip { padding: 7px 12px; border-radius: 999px; border: 1px solid #C9D1C6; background: #FFF; color: #3A463A; font-size: 13px; font-weight: 600; white-space: nowrap; cursor: pointer; flex-shrink: 0; }
  .chip.active { border-color: var(--header); background: var(--header); color: var(--headertext); }
  .nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: #fff; border-top: 1px solid var(--line); display: flex; justify-content: space-around; align-items: center; padding: 8px 0 14px; z-index: 30; }
  .navbtn { background: none; border: none; font-size: 13px; color: #7A857A; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 4px 10px; }
  .navbtn.active { font-weight: 700; color: var(--header); }
  .fab { background: var(--header); color: var(--headertext); border: none; border-radius: 50%; width: 58px; height: 58px; font-size: 26px; font-weight: 300; cursor: pointer; box-shadow: 0 3px 8px rgba(30,58,43,0.35); margin-top: -26px; }
  .overlay { position: fixed; inset: 0; background: rgba(20,28,20,0.55); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
  .sheet { background: #F6F8F4; width: 100%; max-width: 480px; max-height: 92vh; overflow-y: auto; border-radius: 16px 16px 0 0; padding: 18px 16px 30px; }
  .sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .sheet-title { font-size: 19px; font-weight: 800; }
  .closebtn { background: none; border: none; font-size: 22px; cursor: pointer; color: var(--muted); }
  .leader { display: flex; align-items: baseline; gap: 8px; padding: 6px 0; }
  .dots { flex: 1; border-bottom: 2px dotted #B9C4B6; transform: translateY(-4px); }
  .cat-badge { padding: 2px 8px; border-radius: 999px; font-weight: 700; font-size: 12.5px; }
  .empty { text-align: center; padding: 50px 30px; color: #7A857A; }
  .empty-icon { font-size: 40px; margin-bottom: 10px; }
  .empty-title { font-weight: 700; font-size: 17px; color: #3A463A; }
  .toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); background: #20261F; color: #F2F5EF; padding: 10px 18px; border-radius: 999px; font-size: 14px; font-weight: 600; z-index: 90; white-space: nowrap; }
  .bar-bg { height: 5px; background: #EAEEE8; border-radius: 3px; margin-bottom: 8px; }
  .bar-fg { height: 5px; border-radius: 3px; }
  .receipt-img { width: 100%; border-radius: 10px; display: block; margin-bottom: 12px; }
  .photo-wrap { position: relative; margin-bottom: 12px; }
  .retake-btn { position: absolute; bottom: 10px; right: 10px; }
  .scan-overlay { position: absolute; inset: 0; background: rgba(30,58,43,0.6); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #F2F5EF; font-weight: 700; }
  .search-row { display: flex; gap: 8px; margin: 12px 12px 0; }
  .search-row input { margin-bottom: 0; flex: 1; }
  .small-note { font-size: 12.5px; color: #7A857A; text-align: center; margin-top: 8px; }
  .link-btn { background: none; border: none; color: var(--header); font-weight: 600; text-decoration: underline; cursor: pointer; font-size: 14px; padding: 0; }
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
// ---------------- storage ----------------
const LS_KEYS = { expenses: "bl_expenses", trips: "bl_trips", apiKey: "bl_apikey" };

function load(key, fallback) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch { return fallback; }
}
function save(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); return true; }
  catch (e) { console.error(e); return false; }
}

// ---------------- constants ----------------
const CATEGORIES = ["Meals","Travel","Lodging","Supplies","Equipment","Software & Subscriptions","Marketing & Ads","Production & Props","Shipping","Fees & Services","Other"];
const CAT_COLORS = { "Meals":"#C77B3F","Travel":"#3F7BC7","Lodging":"#7B5EA7","Supplies":"#5E8C61","Equipment":"#4A6670","Software & Subscriptions":"#356E6A","Marketing & Ads":"#B04A5A","Production & Props":"#8A6D3B","Shipping":"#6B7A8F","Fees & Services":"#5C5470","Other":"#777777" };
const fmt = (n) => Number(n||0).toLocaleString("en-US",{style:"currency",currency:"USD"});
const todayISO = () => new Date().toISOString().slice(0,10);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = (s) => (s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// ---------------- state ----------------
let state = {
  expenses: load(LS_KEYS.expenses, []),
  trips: load(LS_KEYS.trips, []),
  apiKey: load(LS_KEYS.apiKey, ""),
  tab: "expenses",
  sheet: null,       // {mode, expense}
  tripSheet: null,   // {trip}
  detail: null,      // expense
  openTripId: null,
  fCat: "All", fTrip: "All", fFrom: "", fTo: "", search: "",
  showFilters: false,
  summaryYear: null,
  toast: "",
};

function persistExpenses() { const ok = save(LS_KEYS.expenses, state.expenses); if (!ok) showToast("Storage full — export a backup and delete old photos"); }
function persistTrips() { save(LS_KEYS.trips, state.trips); }

function showToast(msg) {
  state.toast = msg; render();
  setTimeout(() => { state.toast = ""; render(); }, 2600);
}

// ---------------- image compression ----------------
function compressImage(file, maxDim, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        const scale = Math.min(1, maxDim / Math.max(width, height));
        width = Math.round(width * scale); height = Math.round(height * scale);
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// ---------------- optional AI receipt scan (uses the user's own key) ----------------
async function scanReceipt(dataUrl) {
  if (!state.apiKey) throw new Error("no-key");
  const base64 = dataUrl.split(",")[1];
  const prompt = `Read this receipt image. Respond ONLY with a JSON object, no markdown, no backticks:
{"vendor": string, "date": "YYYY-MM-DD" or null, "amount": number or null, "category": one of ${JSON.stringify(CATEGORIES)}, "notes": short string}
Use null (or "Other" for category) if unreadable.`;
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": state.apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
    },
    body: JSON.stringify({
      model: "claude-haiku-4-5-20251001",
      max_tokens: 500,
      messages: [{ role: "user", content: [
        { type: "image", source: { type: "base64", media_type: "image/jpeg", data: base64 } },
        { type: "text", text: prompt },
      ]}],
    }),
  });
  const data = await response.json();
  if (data.error) throw new Error(data.error.message || "api-error");
  const text = (data.content || []).filter(b => b.type === "text").map(b => b.text).join("\n");
  return JSON.parse(text.replace(/```json|```/g, "").trim());
}

// ---------------- CSV export ----------------
function tripName(id) { return (state.trips.find(t => t.id === id) || {}).name || ""; }

function exportCSV(rows, filename) {
  const head = "Date,Vendor,Amount,Category,Trip,Notes\n";
  const body = rows.map(e => [
    e.date,
    `"${(e.vendor||"").replace(/"/g,'""')}"`,
    Number(e.amount||0).toFixed(2),
    `"${e.category}"`,
    `"${tripName(e.tripId)}"`,
    `"${(e.notes||"").replace(/"/g,'""')}"`,
  ].join(",")).join("\n");
  const blob = new Blob([head + body], { type: "text/csv" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

function exportBackup() {
  const blob = new Blob([JSON.stringify({ expenses: state.expenses, trips: state.trips }, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `ledger-backup-${todayISO()}.json`; a.click();
  URL.revokeObjectURL(url);
}

function importBackup(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      if (!Array.isArray(parsed.expenses) || !Array.isArray(parsed.trips)) throw new Error("bad shape");
      state.expenses = parsed.expenses; state.trips = parsed.trips;
      persistExpenses(); persistTrips();
      showToast("Backup restored");
      render();
    } catch { showToast("That file doesn't look like a valid backup"); render(); }
  };
  reader.readAsText(file);
}

// ---------------- filtering ----------------
function filteredExpenses() {
  return state.expenses.filter(e => {
    if (state.fCat !== "All" && e.category !== state.fCat) return false;
    if (state.fTrip !== "All" && (e.tripId||"") !== state.fTrip) return false;
    if (state.fFrom && e.date < state.fFrom) return false;
    if (state.fTo && e.date > state.fTo) return false;
    if (state.search && !((e.vendor||"")+" "+(e.notes||"")).toLowerCase().includes(state.search.toLowerCase())) return false;
    return true;
  }).sort((a,b) => a.date < b.date ? 1 : -1);
}

// ---------------- render ----------------
function render() {
  const app = document.getElementById("app");
  const year = new Date().getFullYear();
  const ytd = state.expenses.filter(e => (e.date||"").startsWith(String(year))).reduce((s,e)=>s+Number(e.amount||0),0);
  const filtered = filteredExpenses();
  const filteredTotal = filtered.reduce((s,e)=>s+Number(e.amount||0),0);

  app.innerHTML = `
    <div class="header">
      <div class="eyebrow">Business Ledger</div>
      <div class="header-row">
        <div>
          <div class="header-sub">${year} year to date</div>
          <div class="header-big mono">${fmt(ytd)}</div>
        </div>
        ${state.tab === "expenses" ? `<div style="text-align:right"><div class="header-sub">${filtered.length} shown</div><div class="header-small mono">${fmt(filteredTotal)}</div></div>` : ""}
      </div>
    </div>
    <div id="tabcontent"></div>
    <div class="nav">
      <button class="navbtn ${state.tab==='expenses'?'active':''}" onclick="setTab('expenses')"><span style="font-size:20px">▤</span>Expenses</button>
      <button class="fab" onclick="openExpenseSheet()">＋</button>
      <button class="navbtn ${state.tab==='trips'?'active':''}" onclick="setTab('trips')"><span style="font-size:20px">⌖</span>Trips</button>
      <button class="navbtn ${state.tab==='summary'?'active':''}" onclick="setTab('summary')"><span style="font-size:20px">Σ</span>Summary</button>
    </div>
    ${state.sheet ? renderExpenseSheet() : ""}
    ${state.tripSheet ? renderTripSheet() : ""}
    ${state.detail ? renderDetailSheet() : ""}
    ${state.toast ? `<div class="toast">${esc(state.toast)}</div>` : ""}
  `;

  const tabc = document.getElementById("tabcontent");
  if (state.tab === "expenses") tabc.innerHTML = renderExpensesTab(filtered);
  else if (state.tab === "trips") tabc.innerHTML = renderTripsTab();
  else tabc.innerHTML = renderSummaryTab();

  wireDynamicHandlers();
}

function setTab(t) { state.tab = t; render(); }

// ---------- expenses tab ----------
function renderExpensesTab(filtered) {
  const activeFilters = (state.fCat!=="All") + (state.fTrip!=="All") + !!state.fFrom + !!state.fTo;
  return `
    <div class="search-row">
      <input id="searchInput" placeholder="Search vendor or notes" value="${esc(state.search)}">
      <button class="chip ${state.showFilters||activeFilters>0?'active':''}" style="padding:0 14px" onclick="toggleFilters()">Filters${activeFilters?` · ${activeFilters}`:""}</button>
    </div>
    ${state.showFilters ? `
      <div class="card">
        <label class="field-label">Category</label>
        <div class="chip-row">
          ${["All",...CATEGORIES].map(c=>`<button class="chip ${state.fCat===c?'active':''}" onclick="setFilter('fCat','${esc(c)}')">${esc(c)}</button>`).join("")}
        </div>
        <label class="field-label">Trip</label>
        <select id="tripFilter" onchange="setFilter('fTrip', this.value)">
          <option value="All" ${state.fTrip==="All"?"selected":""}>All trips</option>
          <option value="" ${state.fTrip===""?"selected":""}>No trip</option>
          ${state.trips.map(t=>`<option value="${t.id}" ${state.fTrip===t.id?"selected":""}>${esc(t.name)}</option>`).join("")}
        </select>
        <div class="row">
          <div style="flex:1"><label class="field-label">From</label><input type="date" value="${state.fFrom}" onchange="setFilter('fFrom', this.value)"></div>
          <div style="flex:1"><label class="field-label">To</label><input type="date" value="${state.fTo}" onchange="setFilter('fTo', this.value)"></div>
        </div>
        <div class="row">
          <button class="btn-ghost" style="padding:10px" onclick="clearFilters()">Clear filters</button>
          <button class="btn-ghost" style="padding:10px" onclick="exportCSV(filteredExpenses(),'expenses-filtered.csv')">Export shown (CSV)</button>
        </div>
      </div>` : ""}
    ${filtered.length===0 ? `
      <div class="empty">
        <div class="empty-icon">▤</div>
        <div class="empty-title">No expenses here yet</div>
        <div style="font-size:14px;margin-top:6px">Tap the ＋ button and snap a photo of a receipt to add your first one.</div>
      </div>` : filtered.map(e => `
      <div class="card" style="cursor:pointer" onclick="openDetail('${e.id}')">
        <div style="display:flex;align-items:baseline;gap:8px">
          <div style="font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55%">${esc(e.vendor)||"Untitled"}</div>
          <div class="dots"></div>
          <div class="mono" style="font-weight:700;font-size:16px">${fmt(e.amount)}</div>
        </div>
        <div style="display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12.5px;color:var(--muted)">
          <span class="cat-badge" style="background:${(CAT_COLORS[e.category]||'#777')}22;color:${CAT_COLORS[e.category]||'#555'}">${esc(e.category)}</span>
          <span class="mono">${e.date}</span>
          ${e.tripId ? `<span>· ${esc(tripName(e.tripId))}</span>` : ""}
          ${e.photo ? `<span>· 📷</span>` : ""}
        </div>
      </div>`).join("")}
  `;
}

function toggleFilters() { state.showFilters = !state.showFilters; render(); }
function setFilter(key, val) { state[key] = val; render(); }
function clearFilters() { state.fCat="All"; state.fTrip="All"; state.fFrom=""; state.fTo=""; state.search=""; render(); }

// ---------- expense sheet ----------
let draftPhoto = null;
let draftScanning = false;

function openExpenseSheet(id) {
  const exp = id ? state.expenses.find(e=>e.id===id) : null;
  draftPhoto = exp ? exp.photo : null;
  draftScanning = false;
  state.sheet = { mode: exp ? "edit" : "new", expense: exp };
  render();
}
function closeSheet() { state.sheet = null; render(); }

function renderExpenseSheet() {
  const exp = state.sheet.expense;
  const vendor = exp ? exp.vendor : "";
  const amount = exp ? exp.amount : "";
  const date = exp ? exp.date : todayISO();
  const category = exp ? exp.category : "Meals";
  const tripId = exp ? (exp.tripId||"") : "";
  const notes = exp ? exp.notes : "";
  return `
  <div class="overlay" onclick="closeSheet()">
    <div class="sheet" onclick="event.stopPropagation()">
      <div class="sheet-head">
        <div class="sheet-title">${exp ? "Edit expense" : "New expense"}</div>
        <button class="closebtn" onclick="closeSheet()">✕</button>
      </div>
      <input type="file" id="photoInput" accept="image/*" style="display:none">
      <div id="photoArea">${renderPhotoArea()}</div>

      <label class="field-label">Vendor</label>
      <input id="fVendor" value="${esc(vendor)}" placeholder="Where you spent it">

      <div class="row">
        <div style="flex:1"><label class="field-label">Amount</label><input id="fAmount" class="mono" type="number" inputmode="decimal" step="0.01" value="${amount}" placeholder="0.00"></div>
        <div style="flex:1"><label class="field-label">Date</label><input id="fDate" type="date" value="${date}"></div>
      </div>

      <label class="field-label">Category</label>
      <div class="chip-row" id="catRow">
        ${CATEGORIES.map(c=>`<button class="chip ${category===c?'active':''}" data-cat="${esc(c)}" onclick="pickCategory('${esc(c)}')">${esc(c)}</button>`).join("")}
      </div>

      <label class="field-label">Trip (optional)</label>
      <select id="fTripId">
        <option value="">No trip</option>
        ${state.trips.map(t=>`<option value="${t.id}" ${tripId===t.id?"selected":""}>${esc(t.name)}</option>`).join("")}
      </select>

      <label class="field-label">Notes</label>
      <input id="fNotes" value="${esc(notes)}" placeholder="What was it for?">

      <button class="btn-primary" onclick="submitExpense()" ${draftScanning?"disabled":""}>${exp?"Save changes":"Save expense"}</button>
      ${exp ? `<button class="btn-ghost btn-danger" style="margin-top:10px" onclick="deleteExpense('${exp.id}')">Delete expense</button>` : ""}

      <div style="margin-top:14px;border-top:1px solid var(--line);padding-top:10px">
        <button class="link-btn" onclick="openSettings()">⚙ Receipt scanning settings</button>
      </div>
    </div>
  </div>`;
}

function renderPhotoArea() {
  if (draftPhoto) {
    return `<div class="photo-wrap">
      <img class="receipt-img" src="${draftPhoto}">
      <button class="chip active retake-btn" onclick="document.getElementById('photoInput').click()">Retake</button>
      ${draftScanning ? `<div class="scan-overlay">Reading receipt…</div>` : ""}
    </div>`;
  }
  return `<button class="btn-ghost" style="padding:22px;margin-bottom:12px" onclick="document.getElementById('photoInput').click()">📷 Add receipt photo</button>`;
}

let selectedCategory = null;
function pickCategory(c) { selectedCategory = c; document.querySelectorAll('#catRow .chip').forEach(el=>el.classList.toggle('active', el.dataset.cat===c)); }

async function handlePhotoFile(file) {
  if (!file) return;
  try {
    const dataUrl = await compressImage(file, 900, 0.55);
    draftPhoto = dataUrl;
    document.getElementById("photoArea").innerHTML = renderPhotoArea();
    if (state.apiKey) {
      draftScanning = true;
      document.getElementById("photoArea").innerHTML = renderPhotoArea();
      try {
        const r = await scanReceipt(dataUrl);
        if (r.vendor) document.getElementById("fVendor").value = r.vendor;
        if (r.amount != null) document.getElementById("fAmount").value = r.amount;
        if (r.date) document.getElementById("fDate").value = r.date;
        if (r.category && CATEGORIES.includes(r.category)) pickCategory(r.category);
        if (r.notes) document.getElementById("fNotes").value = r.notes;
        showToastQuiet("Receipt read — check the details");
      } catch (e) {
        showToastQuiet(state.apiKey ? "Couldn't read the receipt — enter details manually" : "");
      }
      draftScanning = false;
      document.getElementById("photoArea").innerHTML = renderPhotoArea();
    }
  } catch { showToastQuiet("Couldn't load that photo"); }
}
function showToastQuiet(msg) { if(!msg) return; state.toast = msg; renderToastOnly(); setTimeout(()=>{ state.toast=""; renderToastOnly(); }, 2600); }
function renderToastOnly() {
  const existing = document.querySelector(".toast");
  if (existing) existing.remove();
  if (state.toast) {
    const div = document.createElement("div");
    div.className = "toast"; div.textContent = state.toast;
    document.body.appendChild(div);
  }
}

function submitExpense() {
  const vendor = document.getElementById("fVendor").value.trim();
  const amount = Number(document.getElementById("fAmount").value || 0);
  const date = document.getElementById("fDate").value || todayISO();
  const category = selectedCategory || (state.sheet.expense ? state.sheet.expense.category : "Meals");
  const tripId = document.getElementById("fTripId").value;
  const notes = document.getElementById("fNotes").value.trim();
  if (!vendor && !amount) { showToast("Add at least a vendor or amount"); return; }
  const exp = {
    id: state.sheet.expense ? state.sheet.expense.id : uid(),
    vendor, amount, date, category, tripId, notes, photo: draftPhoto || null,
  };
  const idx = state.expenses.findIndex(e => e.id === exp.id);
  if (idx >= 0) state.expenses[idx] = exp; else state.expenses.unshift(exp);
  persistExpenses();
  selectedCategory = null;
  state.sheet = null;
  showToast(idx >= 0 ? "Expense updated" : "Expense saved");
}

function deleteExpense(id) {
  if (!confirm("Delete this expense and its receipt photo?")) return;
  state.expenses = state.expenses.filter(e => e.id !== id);
  persistExpenses();
  state.sheet = null; state.detail = null;
  showToast("Deleted");
}

// ---------- detail sheet ----------
function openDetail(id) { state.detail = state.expenses.find(e=>e.id===id); render(); }
function closeDetail() { state.detail = null; render(); }
function editFromDetail() { const id = state.detail.id; state.detail = null; openExpenseSheet(id); }

function renderDetailSheet() {
  const e = state.detail;
  return `
  <div class="overlay" onclick="closeDetail()">
    <div class="sheet" onclick="event.stopPropagation()">
      <div class="sheet-head">
        <div class="sheet-title">${esc(e.vendor)||"Expense"}</div>
        <button class="closebtn" onclick="closeDetail()">✕</button>
      </div>
      ${e.photo ? `<img class="receipt-img" src="${e.photo}">` : ""}
      <div class="card" style="margin:0 0 12px">
        ${[["Amount",fmt(e.amount),true],["Date",e.date,true],["Category",e.category],["Trip", e.tripId?tripName(e.tripId):"—"],["Notes",e.notes||"—"]].map(([k,v,m])=>`
          <div class="leader"><span style="font-size:13px;font-weight:700;color:var(--muted)">${k}</span><div class="dots"></div><span style="font-size:15px;font-weight:600;text-align:right${m?';font-variant-numeric:tabular-nums':''}">${esc(String(v))}</span></div>
        `).join("")}
      </div>
      <button class="btn-primary" onclick="editFromDetail()">Edit</button>
      <button class="btn-ghost btn-danger" style="margin-top:10px" onclick="deleteExpense('${e.id}')">Delete</button>
    </div>
  </div>`;
}

// ---------- trips ----------
function tripTotal(id) { return state.expenses.filter(e=>e.tripId===id).reduce((s,e)=>s+Number(e.amount||0),0); }
function tripCount(id) { return state.expenses.filter(e=>e.tripId===id).length; }

function renderTripsTab() {
  return `
    <div style="margin:12px 12px 0"><button class="btn-primary" onclick="openTripSheet()">＋ New trip</button></div>
    ${state.trips.length===0 ? `
      <div class="empty">
        <div class="empty-icon">⌖</div>
        <div class="empty-title">No trips yet</div>
        <div style="font-size:14px;margin-top:6px">Create a trip, then attach expenses to it when you add them.</div>
      </div>` : state.trips.map(t => `
      <div class="card">
        <div style="display:flex;align-items:baseline;gap:8px;cursor:pointer" onclick="toggleTripOpen('${t.id}')">
          <div style="font-weight:800;font-size:16px">${esc(t.name)}</div>
          <div class="dots"></div>
          <div class="mono" style="font-weight:700">${fmt(tripTotal(t.id))}</div>
        </div>
        <div style="font-size:12.5px;color:var(--muted);margin-top:4px">
          <span class="mono">${t.start||"?"} → ${t.end||"?"}</span> · ${tripCount(t.id)} expense${tripCount(t.id)===1?"":"s"}
        </div>
        ${state.openTripId===t.id ? `
          <div style="margin-top:10px;border-top:1px solid #E4E9E2;padding-top:8px">
            ${state.expenses.filter(e=>e.tripId===t.id).map(e=>`
              <div class="leader" style="cursor:pointer" onclick="openDetail('${e.id}')">
                <span style="font-size:14px;font-weight:600">${esc(e.vendor)||"Untitled"}</span>
                <div class="dots"></div>
                <span class="mono" style="font-size:14px;font-weight:700">${fmt(e.amount)}</span>
              </div>`).join("") || `<div style="font-size:13.5px;color:#7A857A">No expenses attached yet.</div>`}
            <div class="row" style="margin-top:10px">
              <button class="btn-ghost" style="padding:9px;font-size:13.5px" onclick="openTripSheet('${t.id}')">Edit trip</button>
              <button class="btn-ghost btn-danger" style="padding:9px;font-size:13.5px" onclick="deleteTrip('${t.id}')">Delete trip</button>
            </div>
          </div>` : ""}
      </div>`).join("")}
  `;
}
function toggleTripOpen(id) { state.openTripId = state.openTripId===id ? null : id; render(); }

function openTripSheet(id) { const trip = id ? state.trips.find(t=>t.id===id) : null; state.tripSheet = { trip }; render(); }
function closeTripSheet() { state.tripSheet = null; render(); }

function renderTripSheet() {
  const t = state.tripSheet.trip;
  return `
  <div class="overlay" onclick="closeTripSheet()">
    <div class="sheet" onclick="event.stopPropagation()">
      <div class="sheet-title" style="margin-bottom:14px">${t?"Edit trip":"New trip"}</div>
      <label class="field-label">Trip name</label>
      <input id="tName" value="${t?esc(t.name):''}" placeholder="e.g. Miami shoot, March">
      <div class="row">
        <div style="flex:1"><label class="field-label">Start</label><input id="tStart" type="date" value="${t?t.start||'':''}"></div>
        <div style="flex:1"><label class="field-label">End</label><input id="tEnd" type="date" value="${t?t.end||'':''}"></div>
      </div>
      <label class="field-label">Business purpose</label>
      <input id="tPurpose" value="${t?esc(t.purpose||''):''}" placeholder="Why the trip was for business">
      <button class="btn-primary" onclick="submitTrip('${t?t.id:''}')">${t?"Save changes":"Create trip"}</button>
    </div>
  </div>`;
}
function submitTrip(id) {
  const name = document.getElementById("tName").value.trim();
  if (!name) return;
  const start = document.getElementById("tStart").value;
  const end = document.getElementById("tEnd").value;
  const purpose = document.getElementById("tPurpose").value.trim();
  const trip = { id: id || uid(), name, start, end, purpose };
  const idx = state.trips.findIndex(t=>t.id===trip.id);
  if (idx>=0) state.trips[idx]=trip; else state.trips.unshift(trip);
  persistTrips();
  state.tripSheet = null;
  showToast(idx>=0?"Trip updated":"Trip created");
}
function deleteTrip(id) {
  const t = state.trips.find(x=>x.id===id);
  if (!confirm(`Delete trip "${t.name}"? Expenses will be kept, just unassigned.`)) return;
  state.trips = state.trips.filter(x=>x.id!==id);
  persistTrips();
  state.openTripId = null;
  showToast("Trip deleted");
}

// ---------- summary ----------
function renderSummaryTab() {
  const years = [...new Set(state.expenses.map(e=>(e.date||"").slice(0,4)).filter(Boolean))].sort().reverse();
  if (!state.summaryYear) state.summaryYear = years[0] || String(new Date().getFullYear());
  const year = state.summaryYear;
  const yearExp = state.expenses.filter(e => (e.date||"").startsWith(year));
  const total = yearExp.reduce((s,e)=>s+Number(e.amount||0),0);
  const byCat = CATEGORIES.map(c => ({ cat:c, total: yearExp.filter(e=>e.category===c).reduce((s,e)=>s+Number(e.amount||0),0), n: yearExp.filter(e=>e.category===c).length })).filter(r=>r.n>0).sort((a,b)=>b.total-a.total);

  return `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <label class="field-label" style="margin:0">Tax year</label>
        <select style="width:auto;margin:0;padding:6px 10px;font-weight:700" onchange="setSummaryYear(this.value)">
          ${(years.length?years:[year]).map(y=>`<option value="${y}" ${y===year?"selected":""}>${y}</option>`).join("")}
        </select>
      </div>
      <div class="mono" style="font-size:34px;font-weight:800;margin-top:8px">${fmt(total)}</div>
      <div style="font-size:13px;color:var(--muted)">${yearExp.length} expenses recorded in ${year}</div>
    </div>
    <div class="card">
      <label class="field-label">By category</label>
      ${byCat.length===0 ? `<div style="font-size:14px;color:#7A857A">Nothing recorded for ${year} yet.</div>` : byCat.map(r=>`
        <div class="leader"><span style="font-size:14.5px;font-weight:700">${esc(r.cat)}</span><div class="dots"></div><span class="mono" style="font-weight:700">${fmt(r.total)}</span></div>
        <div class="bar-bg"><div class="bar-fg" style="width:${total?(r.total/total*100):0}%;background:${CAT_COLORS[r.cat]||'#777'}"></div></div>
      `).join("")}
    </div>
    <div class="card">
      <label class="field-label">By trip</label>
      ${state.trips.length===0 ? `<div style="font-size:14px;color:#7A857A">No trips created yet.</div>` : state.trips.map(t=>{
        const tt = yearExp.filter(e=>e.tripId===t.id).reduce((s,e)=>s+Number(e.amount||0),0);
        if (!tt) return "";
        return `<div class="leader"><span style="font-size:14.5px;font-weight:700">${esc(t.name)}</span><div class="dots"></div><span class="mono" style="font-weight:700">${fmt(tt)}</span></div>`;
      }).join("")}
    </div>
    <div style="margin:12px">
      <button class="btn-primary" onclick="exportCSV(state.expenses.filter(e=>(e.date||'').startsWith('${year}')), 'expenses-${year}.csv')">Export ${year} for taxes (CSV)</button>
      <div class="small-note">The CSV opens in Excel or Google Sheets — handy to hand to a tax preparer.</div>
    </div>
    <div class="card">
      <label class="field-label">Backup your data</label>
      <div style="font-size:13.5px;color:var(--muted);margin-bottom:10px">Everything is stored only on this device's browser. Export a backup now and then so you never lose it.</div>
      <div class="row">
        <button class="btn-ghost" onclick="exportBackup()">Export backup</button>
        <button class="btn-ghost" onclick="document.getElementById('backupInput').click()">Import backup</button>
      </div>
      <input type="file" id="backupInput" accept="application/json" style="display:none">
    </div>
  `;
}
function setSummaryYear(y) { state.summaryYear = y; render(); }

// ---------- settings ----------
function openSettings() {
  const key = prompt(
    "Optional: paste your own Anthropic API key to enable automatic receipt scanning.\n\n" +
    "This stays only on your device and is sent directly to Anthropic's API when you scan a receipt. " +
    "Leave blank and press OK to just clear/skip this — you can always enter receipt details manually.",
    state.apiKey || ""
  );
  if (key === null) return;
  state.apiKey = key.trim();
  save(LS_KEYS.apiKey, state.apiKey);
  showToast(state.apiKey ? "Receipt scanning enabled" : "Receipt scanning turned off");
}

// ---------- wiring ----------
function wireDynamicHandlers() {
  const photoInput = document.getElementById("photoInput");
  if (photoInput) photoInput.onchange = (e) => handlePhotoFile(e.target.files[0]);

  const searchInput = document.getElementById("searchInput");
  if (searchInput) {
    searchInput.oninput = (e) => { state.search = e.target.value; };
    searchInput.onblur = () => render();
    searchInput.addEventListener("keydown", (e) => { if (e.key === "Enter") render(); });
  }

  const backupInput = document.getElementById("backupInput");
  if (backupInput) backupInput.onchange = (e) => importBackup(e.target.files[0]);

  if (state.sheet) {
    selectedCategory = state.sheet.expense ? state.sheet.expense.category : "Meals";
  }
}

// expose needed globals (since this is a plain script, not a module)
window.setTab = setTab;
window.openExpenseSheet = openExpenseSheet;
window.closeSheet = closeSheet;
window.pickCategory = pickCategory;
window.submitExpense = submitExpense;
window.deleteExpense = deleteExpense;
window.openDetail = openDetail;
window.closeDetail = closeDetail;
window.editFromDetail = editFromDetail;
window.toggleTripOpen = toggleTripOpen;
window.openTripSheet = openTripSheet;
window.closeTripSheet = closeTripSheet;
window.submitTrip = submitTrip;
window.deleteTrip = deleteTrip;
window.setSummaryYear = setSummaryYear;
window.openSettings = openSettings;
window.toggleFilters = toggleFilters;
window.setFilter = setFilter;
window.clearFilters = clearFilters;
window.exportCSV = exportCSV;
window.exportBackup = exportBackup;
window.state = state;
window.filteredExpenses = filteredExpenses;

render();
</script>
</body>
</html>
